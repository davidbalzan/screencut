<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=JetBrains+Mono:wght@500;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
#root{position:absolute;inset:0}
.mono{font-family:"JetBrains Mono",monospace}
.osw{font-family:Oswald;text-transform:uppercase}
.inter{font-family:Inter}
</style>
<script src="../common.js"></script></head>
<body><div id="root"></div>
<script>
// The CCTV HUD, drawn for a time t (seconds). window.render(t) is called once per frame by
// render.mjs; everything is a pure function of t, so frames are smooth and identical every
// run. No CSS animations, no timers.
// window.__TL = { total, intro:{len,alert,title,sub}, end:{len,line,url,logoHtml},
//                 scenes:[{n,start,end,rect:[x,y,w,h],title,sub,cam}], brand:{accent,alert,glow,site,date,clock} }
const TL = window.__TL;
const B = TL.brand;
document.head.insertAdjacentHTML("beforeend", `<style>.a,.g{color:${B.accent}}</style>`);
const root = document.getElementById("root");
const GLYPHS = "ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#$%&@*<>/\\";
const S = TL.style ?? {};

// Text that decodes from scrambled glyphs, left to right. `parts` is [[text, class], …]
// (class "a" = the accent colour); p goes 0 → 1.
function decode(parts, p, seed) {
  if (typeof parts === "string") parts = [[parts, ""]];
  const n = parts.reduce((a, [s]) => a + s.length, 0);
  const shown = Math.floor(ease(p) * (n + 4));
  let k = 0;
  return parts.map(([s, cls]) => `<span class="${cls}">` + s.split("").map((ch) => {
    const i = k++;
    if (ch === " ") return " ";
    if (i < shown - 3) return esc(ch);
    if (i < shown) return esc(GLYPHS[Math.floor(rnd(seed + i * 7 + Math.floor(p * 40)) * GLYPHS.length)]);
    return `<span style="opacity:0">${esc(ch)}</span>`; // keeps the line width: no shift
  }).join("") + "</span>").join("");
}

function brackets([x, y, w, h], p) {
  const grow = (1 - ease(p)) * 60, L = 46, s = 3, c = B.accent;
  const X = x - 14 - grow, Y = y - 14 - grow, W = w + 28 + grow * 2, H = h + 28 + grow * 2;
  const corner = (cx, cy, dx, dy) => `<div style="position:absolute;left:${cx}px;top:${cy}px;width:${L}px;height:${L}px;border-color:${c};border-style:solid;border-width:${dy < 0 ? 0 : s}px ${dx > 0 ? 0 : s}px ${dy > 0 ? 0 : s}px ${dx < 0 ? 0 : s}px;transform:translate(${dx > 0 ? 0 : -L}px,${dy > 0 ? 0 : -L}px)"></div>`;
  return `<div style="opacity:${ease(p * 1.4)}">${corner(X, Y, 1, 1)}${corner(X + W, Y, -1, 1)}${corner(X, Y + H, 1, -1)}${corner(X + W, Y + H, -1, -1)}</div>`;
}

// The REC light, a label and the running timestamp along the top.
function rec(t, f, label) {
  const blink = Math.floor(t * 2) % 2 === 0;
  const [hh, mm, ss] = (B.clock ?? "04:21:07").split(":").map(Number);
  const secs = hh * 3600 + mm * 60 + ss + t;
  return `<div class="mono" style="position:absolute;left:90px;top:22px;font-size:20px;letter-spacing:.14em;color:#cbd5e1;display:flex;gap:26px;align-items:center">
      <span style="color:${B.alert};opacity:${blink ? 1 : 0.25}">● REC</span><span>${esc(label)}</span><span style="color:#64748b">${esc(B.site)}</span></div>
    <div class="mono" style="position:absolute;right:60px;top:22px;font-size:20px;letter-spacing:.1em;color:#64748b">${esc(B.date)} ${pad(Math.floor(secs / 3600) % 24)}:${pad(Math.floor(secs / 60) % 60)}:${pad(Math.floor(secs) % 60)}:${pad(f % 30)}</div>`;
}

// A type scene (no footage): text decoding on the dark canvas. The title decodes, the lines
// one by one, each then cut by a red line; `then` decodes in their place; chips type in as
// bracketed tags. Sizes fit the frame (Oswald is measured, common.js textWidth).
function typeScene(sc, t) {
  const C = sc.cues, ls = sc.lines ?? [], chips = sc.chips ?? [];
  const plain = (x) => (typeof x === "string" ? x : x.map(([s]) => s).join("")).toUpperCase();
  const fit = (text, maxW, maxPx, weight = 700) => Math.min(maxPx, Math.floor((maxW / Math.max(textWidth(text, `${weight} 100px Oswald`), 1)) * 100));
  const area = "position:absolute;left:120px;right:120px;top:90px;bottom:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px";
  if (sc.then && t >= C.then) {
    return `<div style="${area}"><div class="mono" style="font-size:22px;letter-spacing:.3em;color:${B.alert}">${typed("> DECRYPTED", (t - C.then) / 0.3)}</div>
      <div class="osw" style="font-weight:700;font-size:${fit(plain(sc.then), 1500, 190)}px;line-height:1;color:#fafafa">${decode(sc.then, clamp((t - C.then) / 0.7), 91)}</div></div>`;
  }
  let col = "";
  if (sc.title) col += `<div class="osw" style="font-weight:700;font-size:${fit(plain(sc.title), 1500, ls.length ? 96 : 150)}px;line-height:1.02;color:#fafafa">${decode(sc.title, clamp((t - C.title[0]) / 0.8), sc.n * 31)}</div>`;
  if (sc.sub) col += `<div class="inter" style="font-size:30px;line-height:1.38;color:#94a3b8;min-height:42px">${typed(sc.sub, clamp((t - C.title[1]) / 1.0))}</div>`;
  if (ls.length) {
    const size = Math.min(fit(ls.reduce((m, s) => (s.length > m.length ? s : m), "").toUpperCase(), 1200, 110, 500), Math.floor(560 / (ls.length * 1.15)));
    col += `<div style="display:flex;flex-direction:column;align-items:center;gap:${Math.round(size * 0.12)}px;margin-top:18px">${ls.map((s, i) => {
      const k = struck(sc, i, t, 0.2);
      return `<div class="osw" style="position:relative;font-weight:500;font-size:${size}px;line-height:1.08;letter-spacing:.06em;color:${k > 0 ? "#64748b" : "#e2e8f0"};opacity:${t < C.lines[i] ? 0 : 1}">${decode(s, clamp((t - C.lines[i]) / 0.45), sc.n * 53 + i * 17)}${k > 0
        ? `<div style="position:absolute;left:-3%;top:52%;height:5px;width:${(106 * k).toFixed(1)}%;background:${B.alert};box-shadow:0 0 12px ${B.alert}"></div>` : ""}</div>`;
    }).join("")}</div>`;
  }
  if (chips.length) col += `<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:18px 26px;max-width:1500px;margin-top:26px">${chips.map((c, i) =>
    `<div class="mono" style="font-size:30px;letter-spacing:.12em;color:${B.accent};border:2px solid ${t < C.chips[i] ? "transparent" : B.accent + "88"};padding:10px 20px;opacity:${t < C.chips[i] ? 0 : 1}">[ ${typed(c.toUpperCase(), (t - C.chips[i]) / 0.35)} ]</div>`).join("")}</div>`;
  return `<div style="${area}">${col}</div>`;
}

window.render = (t) => {
  let html = "";
  const inIntro = t < TL.intro.len, inEnd = t >= TL.total - TL.end.len;
  const sc = TL.scenes.find((s) => t >= s.start && t < s.end);
  const f = Math.floor(t * 30);

  // Scanlines + soft vignette over everything.
  if (S.scanlines !== false) html += `<div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.55"></div>`;
  html += `<div style="position:absolute;inset:0;background:radial-gradient(75% 75% at 50% 50%,transparent 60%,rgba(0,0,0,.55) 100%)"></div>`;

  if (inIntro) {
    const L = TL.intro.len, p = t / L;
    html += `<div style="position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 45%,${B.glow} 0%,#03060b 72%);opacity:${t > L - 0.25 ? clamp((L - t) / 0.25) : 1}"></div>`;
    html += `<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center">
      <div class="mono" style="font-size:24px;letter-spacing:.3em;color:${B.alert}">${typed(TL.intro.alert, p * 3)}</div>
      <div class="osw" style="font-weight:700;font-size:${TL.intro.size ?? 200}px;line-height:1;color:#fafafa">${decode(TL.intro.title, clamp((t - 0.3) / 1.2), 11)}</div>
      <div class="mono" style="font-size:28px;letter-spacing:.18em;color:#94a3b8;opacity:${ease((t - 1.4) / 0.6)}">${esc(TL.intro.sub)}</div></div>`;
  }

  if (sc && sc.kind === "type") {
    html += rec(t, f, "INTERCEPT") + typeScene(sc, t);
  } else if (sc) {
    const lt = t - sc.start;
    html += brackets(sc.rect, lt / 0.55) + rec(t, f, sc.cam);
    const panelX = sc.rect[0] + sc.rect[2] + 96;
    html += `<div style="position:absolute;left:${panelX}px;top:0;width:${1860 - panelX}px;height:1080px;display:flex;flex-direction:column;justify-content:center;gap:24px">
      <div class="mono" style="font-size:22px;letter-spacing:.24em;color:${B.accent}">${typed(`> STEP ${pad(sc.n)} // ${pad(TL.scenes.length)}`, lt / 0.45)}</div>
      <div class="osw" style="font-weight:700;font-size:${sc.titleSize ?? 84}px;line-height:1.02;color:#fafafa">${decode(sc.title, clamp((lt - 0.15) / 0.8), sc.n * 31)}</div>
      <div class="inter" style="font-size:29px;line-height:1.38;color:#94a3b8;min-height:120px">${typed(sc.sub, clamp((lt - 0.7) / 1.1))}</div></div>`;
  }

  if (inEnd) {
    const lt = t - (TL.total - TL.end.len);
    html += `<div style="position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 45%,${B.glow} 0%,#03060b 72%);opacity:${clamp(lt / 0.25)}"></div>`;
    html += `<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center">
      <div id="endlogo" style="display:flex;align-items:center;gap:22px;height:120px;opacity:${ease(lt / 0.5)};filter:blur(${(1 - ease(lt / 0.5)) * 8}px)">${TL.end.logoHtml ?? ""}</div>
      <div class="osw" style="font-weight:500;font-size:46px;letter-spacing:.24em;color:#fafafa">${decode(TL.end.line, clamp((lt - 0.4) / 0.9), 77)}</div>
      <div class="mono" style="font-size:30px;letter-spacing:.08em;color:${B.accent}">${typed(TL.end.url ?? "", (lt - 1.1) / 0.6)}</div></div>`;
  }

  // Glitch hits at every cut.
  const cuts = S.cut === "hard" ? [] : [TL.intro.len, ...TL.scenes.map((s) => s.end)];
  for (const c of cuts) {
    const d = t - c;
    if (d > -0.12 && d < 0.18) {
      const k = 1 - Math.abs(d) / 0.18;
      for (let i = 0; i < 7; i++) {
        const y = Math.floor(rnd(f * 3 + i) * 1040), h = 6 + Math.floor(rnd(f * 5 + i) * 46);
        const dx = (rnd(f * 7 + i) - 0.5) * 160 * k;
        const col = i % 3 === 0 ? B.accent + "59" : i % 3 === 1 ? B.alert + "4d" : "rgba(255,255,255,.16)";
        html += `<div style="position:absolute;left:${dx}px;top:${y}px;width:1920px;height:${h}px;background:${col};mix-blend-mode:screen"></div>`;
      }
      html += `<div style="position:absolute;inset:0;background:#fff;opacity:${0.08 * k}"></div>`;
    }
  }
  root.innerHTML = html;
  if (inEnd) applyBlink(root, t - (TL.total - TL.end.len));
};
</script></body></html>
