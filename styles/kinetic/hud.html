<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800;900&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
#ground,#over{position:absolute;inset:0}
.k{font-family:"Inter Tight";font-weight:900;text-transform:uppercase;letter-spacing:-.015em;line-height:.88;white-space:nowrap}
.tag{font-family:"Inter Tight";font-weight:800;text-transform:uppercase;letter-spacing:.2em;white-space:nowrap}
.inter{font-family:Inter}
#wrap{position:absolute;display:none;transform-origin:50% 55%}
#block{position:absolute;inset:0;border-radius:22px}
#win{position:absolute;inset:0;border-radius:18px;overflow:hidden;background:#1d232b}
#win img{display:block;width:100%;height:100%}
</style>
<script src="../common.js"></script></head>
<body><div id="ground"></div><div id="wrap"><div id="block"></div><div id="win"><img alt=""></div></div><div id="over"></div>
<script>
// Kinetic: huge words slam in on the beat, colour-flip grounds, hard cuts, the footage whole
// in a clean rounded window that pushes in. window.render(t) is a pure function of t; the
// footage is drawn here too, from the frames build.py extracted (one JPEG per frame).
// window.__TL = { total, fps, beat, beats[], intro, end:{len,line,url,logoHtml,blink},
//   scenes:[{n,start,fstart,end,rect,title,sub,frames:{dir,n}}], brand:{accent,ground,palette[]} }
const TL = window.__TL, B = TL.brand, FPS = TL.fps ?? 30;
const P = B.palette?.length ? B.palette : [B.accent];
const G = B.ground;
const $ = (id) => document.getElementById(id);
const ground = $("ground"), over = $("over"), wrap = $("wrap"), block = $("block"), img = document.querySelector("#win img");

// ---- colour
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const hex = (c) => "#" + c.map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, "0")).join("");
const mix = (a, b, k) => hex(rgb(a).map((v, i) => v + (rgb(b)[i] - v) * k));
const alpha = (h, a) => `rgba(${rgb(h).join(",")},${a})`;
const lum = (h) => { const [r, g, b] = rgb(h).map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const INK = mix(G, "#000000", 0.45);
const on = (bg) => (lum(bg) > 0.3 ? INK : "#fbfbf7");               // text colour on a ground
const pop = (i) => { const c = P[i % P.length]; return lum(c) > 0.18 ? c : B.accent; }; // bright enough on the dark ground
const groundCss = (glow) => `radial-gradient(85% 95% at 72% 42%,${mix(G, "#ffffff", 0.07)} 0%,${G} 58%,${mix(G, "#000000", 0.35)} 100%)` +
  (glow ? `,radial-gradient(40% 50% at 72% 46%,${alpha(glow, 0.16)} 0%,transparent 70%)` : "");

// ---- type
const ctx = document.createElement("canvas").getContext("2d");
function fitSize(text, maxW, maxPx, weight = 900) { // largest px size (≤ maxPx) at which text fits maxW
  ctx.font = `${weight} 100px "Inter Tight"`;
  const w = ctx.measureText(String(text).toUpperCase()).width;
  return Math.min(maxPx, Math.floor((maxW / Math.max(w, 1)) * 100));
}
// Words of a title [[text, cls], …]; a word may span parts ([["CITRI", ""], ["LLO", "a"]] is one
// word): each keeps its coloured segments.
function words(title) {
  const out = [];
  let cur = null;
  for (const [s, cls] of typeof title === "string" ? [[title, ""]] : title)
    for (const piece of s.split(/(\s+)/)) {
      if (!piece) continue;
      if (/^\s+$/.test(piece)) { cur = null; continue; }
      if (!cur) out.push((cur = { w: "", segs: [] }));
      cur.w += piece;
      cur.segs.push([piece, cls === "a"]);
    }
  return out;
}
const paint = (k, plain, accent) => k.segs.map(([s, a]) => `<span style="color:${a ? accent : plain}">${esc(s)}</span>`).join("");
const typing = (text, p, cursor) => (p < 0 ? "" : typed(text, p, cursor)); // no cursor before typing starts
function halves(title) { // [plain text, accent text]: the title split for the lead-in
  if (typeof title !== "string" && title.some(([, c]) => c === "a") && title.some(([s, c]) => c !== "a" && s.trim()))
    return [title.filter(([, c]) => c !== "a").map(([s]) => s).join("").trim(), title.filter(([, c]) => c === "a").map(([s]) => s).join("").trim()];
  const w = words(title).map((x) => x.w), k = Math.ceil(w.length / 2);
  return [w.slice(0, k).join(" "), w.slice(k).join(" ")];
}
// A slam: scale 1.4 → 1 with a fast ease-out and a blur that clears as it lands.
function slam(dt, from = 1.4) {
  if (dt < 0) return "opacity:0";
  const e = 1 - Math.pow(1 - clamp(dt / 0.22), 4);
  return `transform:scale(${(from - (from - 1) * e).toFixed(4)});filter:blur(${((1 - e) * 10).toFixed(2)}px)`;
}
// n slam times from t0, one per beat of the grid (evenly at TL.beat past its end).
function beatsFrom(t0, n, t1 = Infinity) {
  const out = [t0];
  for (const b of TL.beats ?? []) { if (out.length >= n) break; if (b > t0 + 0.15 && b < t1) out.push(b); }
  while (out.length < n) out.push(out[out.length - 1] + (TL.beat ?? 0.5));
  return out;
}

window.render = (t) => {
  let html = "", bg = null;
  wrap.style.display = "none";
  const sc = TL.scenes.find((s) => t >= s.start && t < s.end);
  const endStart = TL.total - TL.end.len;

  if (t < TL.intro.len) {
    // Intro: each word of the name on its own beat card, colour flipping every beat; then the
    // whole name on the dark ground with the kicker and the line.
    const L = TL.intro.len, toks = words(TL.intro.title), n = toks.length;
    const per = clamp(Math.floor(L / (TL.beat ?? 0.5) / (n + 2)), 1, 2);
    const ts = beatsFrom(0, n * per + 1, L), asm = ts[n * per];
    if (t < asm) {
      const k = ts.filter((x) => x <= t).length - 1, i = Math.floor(k / per);
      bg = P[k % P.length];
      const w = toks[i].w, size = fitSize(w, 1720, 470);
      html += `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
        <div class="k" style="font-size:${size}px;${slam(t - ts[i * per])}">${paint(toks[i], on(bg), on(bg))}</div></div>`;
    } else {
      const lt = t - asm, name = toks.map((x) => x.w).join(" ");
      const size = fitSize(name, 1640, 300);
      const kicker = String(TL.intro.alert ?? "").replace(/^[●•\s]+/, "");
      html += `<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center">
        <div class="tag" style="font-size:30px;color:${pop(1)};${slam(lt, 1.2)}">${esc(kicker)}</div>
        <div class="k" style="font-size:${size}px;${slam(lt)}">${(typeof TL.intro.title === "string" ? [[TL.intro.title, ""]] : TL.intro.title)
          .map(([s, c]) => `<span style="color:${c === "a" ? pop(0) : "#fbfbf7"}">${esc(s)}</span>`).join("")}</div>
        <div style="height:10px;width:${ease((lt - 0.1) / 0.4) * 280}px;background:${pop(1)};border-radius:5px"></div>
        <div class="inter" style="font-weight:600;font-size:30px;letter-spacing:.06em;color:rgba(251,251,247,.86)">${typing(TL.intro.sub ?? "", (lt - 0.25) / 1.1, "|")}</div></div>`;
      bg = null;
    }
  } else if (sc && t < sc.fstart) {
    // Lead-in: the title split in two, one half per beat, the ground flipping colour on each.
    const [a, b] = halves(sc.title);
    const ts = beatsFrom(sc.start, 2, sc.fstart), j = t >= ts[1] ? 1 : 0;
    bg = P[(sc.n - 1 + j) % P.length];
    const c = on(bg);
    html += `<div class="tag" style="position:absolute;left:110px;top:92px;font-size:30px;color:${c};opacity:.8">${pad(sc.n)} / ${pad(TL.scenes.length)}</div>`;
    html += `<div style="position:absolute;left:110px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;gap:18px">
      ${a ? `<div class="k" style="font-size:${fitSize(a, 1700, 190)}px;color:${c};transform-origin:0 50%;${slam(t - ts[0])}">${esc(a)}</div>` : ""}
      ${b ? `<div class="k" style="font-size:${fitSize(b, 1700, 330)}px;color:${c};transform-origin:0 50%;${slam(t - ts[a ? 1 : 0])}">${esc(b)}</div>` : ""}</div>`;
  } else if (sc) {
    // Footage: the whole screen in a rounded window that tilts in and pushes in slowly;
    // the title stacks beside it one word per beat; the subtitle types underneath.
    const ft = t - sc.fstart, [x, y, w, h] = sc.rect, sgn = sc.n % 2 ? 1 : -1;
    const e = ease(ft / 0.5), kb = clamp(ft / (sc.end - sc.fstart));
    const hue = pop(sc.n - 1), hue2 = pop(sc.n);
    bg = "dark"; ground.style.background = groundCss(hue);
    Object.assign(wrap.style, {
      display: "block", left: x + "px", top: y + "px", width: w + "px", height: h + "px",
      transform: `perspective(2400px) translate(${(1 - e) * 90 * sgn}px,${(1 - e) * 60}px) rotateX(${(1 - e) * 9}deg) rotateZ(${(1 - e) * -3.5 * sgn}deg) scale(${((0.9 + 0.1 * e) * (1 + 0.04 * kb)).toFixed(5)})`,
      filter: e < 0.999 ? `blur(${((1 - e) * 7).toFixed(2)}px)` : "none",
    });
    block.style.background = hue;
    block.style.transform = `translate(${26 * ease((ft - 0.1) / 0.4)}px,${26 * ease((ft - 0.1) / 0.4)}px)`;
    $("win").style.boxShadow = `0 34px 80px rgba(0,0,0,.5),0 10px 24px rgba(0,0,0,.35),0 0 130px ${alpha(hue, 0.22)}`;
    if (sc.frames) {
      const i = clamp(Math.floor((t - sc.start) * FPS + 1e-6), 0, sc.frames.n - 1);
      const src = `file://${sc.frames.dir}/${pad(i, 5)}.jpg`;
      if (img.getAttribute("src") !== src) img.setAttribute("src", src);
    } else img.removeAttribute("src");

    const toks = words(sc.title), colW = x - 56 - 96;
    const longest = toks.reduce((m, k) => (k.w.length > m.length ? k.w : m), "");
    const size = Math.min(fitSize(longest, colW, 132), Math.floor(660 / (toks.length * 0.9)));
    const ts = beatsFrom(sc.fstart, toks.length, sc.end);
    html += `<div style="position:absolute;left:96px;width:${colW}px;top:${y}px;height:${h}px;display:flex;flex-direction:column;justify-content:center">
      <div class="tag" style="font-size:24px;color:${hue2};margin-bottom:26px;${slam(ft, 1.2)}">${pad(sc.n)} / ${pad(TL.scenes.length)}</div>
      ${toks.map((k, i) => `<div class="k" style="font-size:${size}px;transform-origin:0 50%;${slam(t - ts[i])}">${paint(k, "#fbfbf7", hue)}</div>`).join("")}
      <div style="margin-top:30px;height:8px;border-radius:4px;background:${hue2};width:${ease((t - ts[ts.length - 1]) / 0.35) * 120}px"></div></div>`;
    const sub = sc.sub ?? "", st = 0.35, dur = Math.min(1.6, 0.028 * sub.length);
    html += `<div class="inter" style="position:absolute;left:${x}px;top:${y + h + 58}px;width:${w}px;font-weight:500;font-size:32px;line-height:1.3;color:rgba(251,251,247,.9)">${typing(sub, (ft - st) / dur, `<span style="color:${hue2}">|</span>`)}</div>`;
  } else if (t >= endStart) {
    // End card: the logo slams in (and blinks), the line lands phrase by phrase, then the url.
    const lt = t - endStart, E = TL.end;
    const phrases = String(E.line ?? "").split(/(?<=[.!?])\s+/).filter(Boolean);
    const ts = beatsFrom(endStart, phrases.length + 2, TL.total);
    const size = fitSize(phrases.join(" "), 1560, 112);
    bg = "dark"; ground.style.background = groundCss(pop(0));
    html += `<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;text-align:center">
      <div id="endlogo" style="display:flex;align-items:center;gap:26px;${slam(lt)}">${E.logoHtml ?? ""}</div>
      <div class="k" style="font-size:${size}px;display:flex;gap:.28em">${phrases.map((s, i) =>
        `<span style="display:inline-block;color:${i === phrases.length - 1 && phrases.length > 1 ? pop(0) : "#fbfbf7"};${slam(t - ts[i + 1])}">${esc(s)}</span>`).join("")}</div>
      <div style="font-family:'Inter Tight';font-weight:700;font-size:40px;letter-spacing:.03em;color:${pop(1)};min-height:48px">${typing(E.url ?? "", (t - ts[phrases.length + 1]) / 0.5, "|")}</div></div>`;
  }

  if (bg !== "dark") ground.style.background = bg ?? groundCss(pop(0));
  over.innerHTML = html;
  if (t >= endStart) applyBlink(over, t - endStart);
};
</script></body></html>
